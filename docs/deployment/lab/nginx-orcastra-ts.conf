# Redacted host nginx for Orcastra lab (no secrets).
# Box lab (1 Sep 2026): listen 127.0.0.1:8088 + Tailscale Serve
#   https://sia.caracal-bee.ts.net  (MagicDNS) so OIDC issuer matches the URL typed.
# Nubi jalur B: ganti server_name / redirect host ke AUTH_ORIGIN kamu.
# Nubi jalur A (localhost tanpa nginx): file ini tidak wajib.
#
# Branding path di box: alias /workspace/orcastra/brand/;
# di laptop ganti ke folder brand lokal, atau hapus location /branding/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 127.0.0.1:8088 default_server;
    # Box: sia.caracal-bee.ts.net
    server_name AUTH_ORIGIN;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 8 32k;

    location /branding/ {
        alias /path/to/orcastra/brand/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /if/ { proxy_pass http://127.0.0.1:9000; }
    location /flows/ { proxy_pass http://127.0.0.1:9000; }
    location = /application/o/orcastra-dashboard/end-session/ {
        return 302 https://AUTH_ORIGIN/if/flow/default-provider-invalidation-flow/;
    }
    location /application/ { proxy_pass http://127.0.0.1:9000; }
    location /media/ { proxy_pass http://127.0.0.1:9000; }
    location /static/ { proxy_pass http://127.0.0.1:9000; }
    location /outpost.goauthentik.io/ { proxy_pass http://127.0.0.1:9000; }
    location /-/ { proxy_pass http://127.0.0.1:9000; }
    location /ws/ { proxy_pass http://127.0.0.1:9000; }
    location /api/v3/ { proxy_pass http://127.0.0.1:9000; }
    location /api/v2/ { proxy_pass http://127.0.0.1:9000; }

    location /api/v1/ { proxy_pass http://127.0.0.1:8765; }
    location = /health { proxy_pass http://127.0.0.1:8765; }
    location /docs { proxy_pass http://127.0.0.1:8765; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8765; }

    location / {
        proxy_pass http://127.0.0.1:4321;
    }
}
