[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   Off

[INPUT]
    Name              tail
    Path              /var/log/orcastra/*.log
    Parser            json
    Tag               orcastra.access
    Refresh_Interval  5
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    DB                /tmp/orcastra.db

[OUTPUT]
    Name                opensearch
    Match               orcastra.*
    Host                opensearch
    Port                9200
    tls                 On
    tls.verify          Off
    HTTP_User           fluentbit
    HTTP_Passwd         ${OPENSEARCH_FLUENTBIT_PASSWORD}
    Logstash_Format     On
    Logstash_Prefix     orcastra-access
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name  On
    Retry_Limit         False
