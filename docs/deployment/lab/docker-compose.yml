# =============================================================================
# Orcastra lab all-in-one — satu komputer (BUKAN Orcastra Mini, BUKAN 4-VM prod)
# =============================================================================
# Pin image:
#   frontend/backend  svlct/orcastra-dashboard:*-1.0.0-RC4   (JANGAN pakai latest)
#   Authentik         ghcr.io/goauthentik/server:2026.8.0     (prod SSO = 2026.2.1)
#   Vault 1.18, OpenSearch 3.5.0, postgres 16 (ak) + 17 (dash),
#   redis 8-alpine, fluent-bit 4.2.2-debug, autoheal 1.2.0
#
# Compose produk docker-compose.prod.yml hanya Dashboard.
# File ini menggabungkan Authentik + Vault + OpenSearch + Dashboard di satu host.
#
# Origin (wajib sama di AUTH_URL / AUTHENTIK_HOST / brand / CORS / issuer):
#   Jalur B (box lab 1 Sep 2026): https://sia.caracal-bee.ts.net
#     host nginx 127.0.0.1:8088 + Tailscale Serve
#   Jalur A (laptop nubi, tanpa Tailscale): http://localhost:4321
#     atau satu origin yang sama — OIDC rusak jika URL yang diketik
#     tidak cocok dengan AUTH_URL / AUTHENTIK_HOST / brand domain
# =============================================================================

name: orcastra

networks:
  orcastra:
    name: orcastra
    driver: bridge

volumes:
  ak-database:
  vault-file:
  vault-logs:
  os-data:
  dash-pg-data:
  dash-redis-data:

services:
  ak-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: ak-postgres
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ak-database:/var/lib/postgresql/data
    networks: [orcastra]

  ak-server:
    image: ghcr.io/goauthentik/server:2026.8.0
    container_name: ak-server
    command: server
    restart: unless-stopped
    shm_size: 512mb
    env_file: [.env]
    environment:
      AUTHENTIK_POSTGRESQL__HOST: ak-postgres
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      # Box lab: https://sia.caracal-bee.ts.net
      # Jalur A: http://localhost:9000  (atau origin tunggal yang sama)
      AUTHENTIK_HOST: ${AUTHENTIK_HOST}
    ports:
      - "${COMPOSE_PORT_HTTP:-9000}:9000"
      - "${COMPOSE_PORT_HTTPS:-9443}:9443"
    volumes:
      - ./authentik/data:/data
      - ./authentik/custom-templates:/templates
    depends_on:
      ak-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/-/health/ready/')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [orcastra]

  ak-worker:
    image: ghcr.io/goauthentik/server:2026.8.0
    container_name: ak-worker
    command: worker
    restart: unless-stopped
    shm_size: 512mb
    user: root
    env_file: [.env]
    environment:
      AUTHENTIK_POSTGRESQL__HOST: ak-postgres
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./authentik/data:/data
      - ./authentik/certs:/certs
      - ./authentik/custom-templates:/templates
    depends_on:
      ak-postgres:
        condition: service_healthy
    networks: [orcastra]

  vault:
    image: hashicorp/vault:1.18
    container_name: vault
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    command: server
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://vault:8200
    volumes:
      - ./vault/config:/vault/config:ro
      - vault-file:/vault/file
      - vault-logs:/vault/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [orcastra]

  vault-fluent-bit:
    image: fluent/fluent-bit:4.2.2-debug
    container_name: vault-fluent-bit
    restart: unless-stopped
    environment:
      OPENSEARCH_FLUENTBIT_PASSWORD: ${OPENSEARCH_FLUENTBIT_PASSWORD}
    volumes:
      - vault-logs:/vault/logs:ro
      - ./vault/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./vault/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    depends_on:
      vault:
        condition: service_started
      opensearch:
        condition: service_started
    networks: [orcastra]

  opensearch:
    image: opensearchproject/opensearch:3.5.0
    container_name: opensearch
    restart: unless-stopped
    environment:
      - cluster.name=orcastra
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Heap diperkecil untuk lab; OpenSearch tetap boros RAM
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - path.repo=/usr/share/opensearch/archive
      - DISABLE_SECURITY_PLUGIN=false
      - plugins.security.allow_unsafe_democertificates=true
      - plugins.security.ssl.http.enabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - os-data:/usr/share/opensearch/data
      - ./opensearch-archive:/usr/share/opensearch/archive
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://127.0.0.1:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks: [orcastra]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
      OPENSEARCH_SSL_VERIFICATIONMODE: none
    depends_on:
      opensearch:
        condition: service_started
    networks: [orcastra]

  postgres:
    image: postgres:17-alpine
    container_name: dash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DASH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DASH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DASH_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - dash-pg-data:/var/lib/postgresql/data
    networks: [orcastra]

  redis:
    image: redis:8-alpine
    container_name: dash-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - dash-redis-data:/data
    networks: [orcastra]

  backend:
    # JANGAN ganti ke :latest — latest di disk lab adalah vintage Mei, bukan RC4
    image: svlct/orcastra-dashboard:backend-1.0.0-RC4
    container_name: backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "1"
      APP_VERSION: ${APP_VERSION}
      AUTHENTIK_API_URL: http://ak-server:9000
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      VAULT_ADDR: http://vault:8200
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_SSL: "true"
      OPENSEARCH_VERIFY_CERTS: "false"
      OPENSEARCH_USER: fluentbit
      OPENSEARCH_PASSWORD: ${OPENSEARCH_FLUENTBIT_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "8765:4050"
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - /var/orcastra/uploads:/var/orcastra/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4050/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    labels:
      - autoheal=true
    extra_hosts:
      # Box lab: sia.caracal-bee.ts.net:<Tailscale IP MagicDNS>
      # agar container resolve issuer yang sama dengan URL di browser.
      # Jalur A localhost: biarkan default host.docker.internal:host-gateway
      # atau hapus blok ini.
      - "${AUTH_HOST:-host.docker.internal}:${AUTH_HOST_IP:-host-gateway}"
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","4050","--workers","1"]
    networks: [orcastra]

  frontend:
    image: svlct/orcastra-dashboard:frontend-1.0.0-RC4
    container_name: frontend
    restart: unless-stopped
    env_file: [.env]
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      AUTHENTIK_API_URL: http://ak-server:9000
      NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL: ${NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL}
      APP_VERSION: ${APP_VERSION}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "4321:2025"
    depends_on:
      - backend
    labels:
      - autoheal=true
    extra_hosts:
      # Sama seperti backend. Box lab: sia.caracal-bee.ts.net:<Tailscale IP>
      - "${AUTH_HOST:-host.docker.internal}:${AUTH_HOST_IP:-host-gateway}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:2025 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [orcastra]

  fluent-bit:
    image: fluent/fluent-bit:4.2.2-debug
    container_name: fluent-bit
    restart: unless-stopped
    environment:
      OPENSEARCH_FLUENTBIT_PASSWORD: ${OPENSEARCH_FLUENTBIT_PASSWORD}
    volumes:
      - ./dashboard/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./dashboard/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/orcastra/uploads:/var/orcastra/uploads:ro
    depends_on:
      opensearch:
        condition: service_started
    networks: [orcastra]

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [orcastra]
