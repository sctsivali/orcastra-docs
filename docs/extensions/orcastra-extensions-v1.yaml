info:
  description: 'The surface an Orcastra add-on calls.


    An add-on runs on your own infrastructure. It authenticates with the credential issued when an

    operator installed it, and receives signed webhooks for the events it subscribed to. No add-on

    code runs inside Orcastra or inside the dashboard''s browser origin.


    Every endpoint here requires both credential headers together. What a credential may do is

    decided by the capabilities and the per-cluster grant the operator consented to, so two

    installations of the same add-on can reach different things.

    '
  title: Orcastra Add-on API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/extensions/self:
    get:
      description: What this credential is installed as, what it may reach, and its resolved settings.
        Poll this to converge after a missed event.
      operationId: get_extensions_self
      parameters:
      - in: header
        name: X-API-Key-ID
        required: true
        schema:
          title: X-Api-Key-Id
          type: string
      - in: header
        name: X-API-Key-Secret
        required: true
        schema:
          title: X-Api-Key-Secret
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Describe Self Api V1 Extensions Self Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: &id001
      - OrcastraKeyId: []
        OrcastraKeySecret: []
      summary: Describe the presenting installation
      tags:
      - Extensions - External
  /api/v1/integrations/clusters:
    get:
      description: The clusters in the key's grant, with their live status.
      operationId: get_integrations_clusters
      parameters:
      - description: Narrow to one cluster
        in: query
        name: cluster_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Narrow to one cluster
          title: Cluster Id
      - in: header
        name: X-API-Key-ID
        required: true
        schema:
          title: X-Api-Key-Id
          type: string
      - in: header
        name: X-API-Key-Secret
        required: true
        schema:
          title: X-Api-Key-Secret
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: *id001
      summary: List the clusters this key may reach
      tags:
      - Integrations - External
      x-orcastra-capabilities:
      - inventory.read
  /api/v1/integrations/external/policies:
    get:
      description: Read tenant access policies from Orcastra for OrcaHub pull sync. Requires valid API
        key.
      operationId: get_integrations_external_policies
      parameters:
      - description: Filter by organization external ID
        in: query
        name: org_external_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by organization external ID
          title: Org External Id
      - in: header
        name: X-API-Key-ID
        required: true
        schema:
          title: X-Api-Key-Id
          type: string
      - in: header
        name: X-API-Key-Secret
        required: true
        schema:
          title: X-Api-Key-Secret
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: *id001
      summary: Read tenant access policies for sync
      tags:
      - Integrations - External
      - Integrations - External
      x-orcastra-capabilities:
      - tenant.provision
  /api/v1/integrations/external/sync-policies:
    post:
      description: Push tenant access policies from OrcaHub to Orcastra. Requires valid API key.
      operationId: post_integrations_external_sync_policies
      parameters:
      - in: header
        name: X-API-Key-ID
        required: true
        schema:
          title: X-Api-Key-Id
          type: string
      - in: header
        name: X-API-Key-Secret
        required: true
        schema:
          title: X-Api-Key-Secret
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPoliciesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: *id001
      summary: Sync tenant access policies from external app
      tags:
      - Integrations - External
      - Integrations - External
      x-orcastra-capabilities:
      - tenant.provision
  /api/v1/integrations/image-uploads:
