servers:
- url: https://<YOUR_ORCASTRA_API>/api/v1
x-orcastra-mcp:
  endpoint: /api/v1/mcp
  note: The MCP endpoint is not modelled as OpenAPI paths. It speaks JSON-RPC, so turning its tools into
    paths would describe something no client can call.
  transport: JSON-RPC over HTTP, authenticated with the same credential headers
